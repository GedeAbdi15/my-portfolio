<!-- contact start -->
<section id="contact" class="pt-20 pb-20">
  <div class="container">
    <div class="w-full px-5 lg:px-20">
      <div class="max-w-xl mx-auto text-center mb-10">
        <h1 class="text-2xl mb-2 capitalize font-bold text-primary text-center">
          contact
        </h1>
      </div>
    </div>

    <!-- form -->
    <div class="w-full mx-auto lg:w-2/3">
      <form>
        <!-- name -->
        <div class="w-full px-5 mb-8">
          <label for="name" class="capitalize text-base font-bold text-primary"
            >name</label
          >
          <input
            type="text"
            id="name"
            class="w-full bg-secondary text-paragraph p-3 rounded-lg focus:outline-none focus:ring-primary focus:ring-1 focus:border-primary focus:bg-backdrop"
          />
        </div>

        <!-- email -->
        <div class="w-full px-5 mb-8">
          <label for="email" class="capitalize text-base font-bold text-primary"
            >email</label
          >
          <input
            type="email"
            id="email"
            class="w-full bg-secondary text-paragraph p-3 rounded-lg focus:outline-none focus:ring-primary focus:ring-1 focus:border-primary focus:bg-backdrop"
          />
        </div>

        <!-- isi pesan -->
        <div class="w-full px-5 mb-8">
          <label
            for="message"
            class="capitalize text-base font-bold text-primary"
            >message</label
          >
          <textarea
            type="text"
            id="message"
            class="w-full bg-secondary text-paragraph p-3 rounded-lg focus:outline-none focus:ring-primary focus:ring-1 focus:border-primary h-32 focus:bg-backdrop"
          ></textarea>
        </div>

        <!-- button -->
        <div class="w-full px-5">
          <button
            href="assets/cv.pdf"
            class="capitalize font-semibold text-backdrop bg-primary py-3 px-6 rounded-full hover:shadow-lg hover:bg-secondary hover:text-stroke transition duration-150 w-full"
            target="_blank"
          >
            send
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
<!-- contact end -->
